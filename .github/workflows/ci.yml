name: RecruitAI Production CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-gate:
    name: Backend Lint, Type, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Static Analysis (eslint)
        run: npm run lint

      - name: Formatting (prettier)
        run: npm run format:check

      - name: TypeScript Static Type Check (src + tests)
        run: npm run typecheck

      - name: Unit, Contract and Client Tests
        run: npm test

      - name: Production Build
        run: npm run build

      # Proves the Phase 19 preflight passes on a complete, non-placeholder
      # production environment (optional integrations warn, hard gates pass).
      - name: Production Preflight (fixture environment)
        env:
          ENVIRONMENT: production
          NODE_ENV: production
          LLM_DATA_USE_MODE: zero_retention_verified
          GEMINI_API_KEY: ci_gemini_key_1234567890
          TAVILY_API_KEY: ci_tavily_key_1234567890
          SUPABASE_URL: https://ci-project.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci_service_role_value_1234567890
          SUPABASE_JWT_SECRET: ci_jwt_secret_value_1234567890abcdef
          DATABASE_URL: postgresql://ci_user:ci_password@db.internal:5432/recruitai
          ALLOWED_ORIGINS: https://ci.recruitai.test
          USE_LOCAL_AUTH: "false"
        run: node dist/cli/preflight.js

  frontend-quality-gate:
    name: Frontend TypeScript, Lint & Build Integrity
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Static Type Check
        run: npx tsc --noEmit

      - name: Next.js Production Build Verification
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-recruitai.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder"
        run: npm run build

      - name: Frontend Verification Tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-recruitai.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder"
        run: npm test

  mobile-quality-gate:
    name: Mobile App TypeScript, Jest & Expo Integrity
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: npm ci

      - name: TypeScript Static Type Check
        run: npx tsc --noEmit

      - name: Mobile Unit & Contract Tests
        run: npm test

      - name: Expo Config Validation
        run: npx expo config --type public
